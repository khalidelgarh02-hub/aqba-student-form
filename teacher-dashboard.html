<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الأستاذ — عقبة بن نافع</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f7;margin:0;color:#1f2937}
.wrap{max-width:1250px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
input,select,button{padding:10px;border:1px solid #ccd3d8;border-radius:8px;font-size:14px}
button{cursor:pointer;background:#126b4f;color:#fff;border:0}button.danger{background:#b42318}
.muted{color:#667085}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #eee;padding:9px;text-align:right;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{font-size:25px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}.error{color:#b42318}
@media(max-width:800px){.grid,.stats{grid-template-columns:1fr 1fr}table{display:block;overflow:auto;white-space:nowrap}}
@media(max-width:520px){.grid,.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="card">
<h1>🔐 لوحة الأستاذ</h1>
<p class="muted">الثانوية التأهيلية عقبة بن نافع — الموسم الدراسي 2026-2027</p>
<div class="grid" style="grid-template-columns:1fr 1fr">
<input id="email" type="email" placeholder="البريد الإلكتروني للأستاذ">
<input id="password" type="password" placeholder="كلمة المرور">
</div>
<br><button onclick="login()">دخول</button>
<p id="loginMsg" class="muted"></p>
</div>

<div id="app" style="display:none">
<div class="card">
<h1>لوحة التحكم</h1>
<div class="stats">
<div><span class="stat" id="count">0</span><br>إجمالي التلاميذ</div>
<div><span class="stat" id="today">0</span><br>مسجلون اليوم</div>
<div><span class="stat" id="classes">0</span><br>أقسام بها تسجيلات</div>
</div>
</div>

<div class="card">
<h2>البحث والتصفية</h2>
<div class="grid">
<input id="search" placeholder="البحث بالاسم">
<select id="level"><option value="">كل المستويات</option></select>
<select id="className"><option value="">كل الأقسام</option></select>
<button onclick="loadStudents()">🔄 تحديث</button>
</div>
</div>

<div class="card actions">
<button onclick="exportCSV()">⬇️ تصدير CSV</button>
<button onclick="logout()" class="danger">تسجيل الخروج</button>
</div>

<div class="card">
<h2>قائمة التلاميذ</h2>
<div id="tableWrap" class="muted">جارٍ التحميل...</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL='https://jwzebyfhsfszpgswnbyh.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3emVieWZoc2ZzenBnc3duYnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5OTg2OTgsImV4cCI6MjEwMzU3NDY5OH0.fh5DvtvMMZn3rPkFnJsVokJJPfJQLZYWGrQsEGrMQbc';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let rows=[];
const levels=["الجذع مشترك علوم","الجذع مشترك آداب","أولى باكالوريا علوم تجريبية","أولى باكالوريا آداب وعلوم إنسانية","الثانية باكالوريا علوم فيزيائية","الثانية باكالوريا علوم الحياة والأرض","الثانية باكالوريا علوم إنسانية","الثانية باكالوريا آداب"];

async function login(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const msg=document.getElementById('loginMsg');
 msg.textContent='جارٍ التحقق...';
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error){msg.textContent='بيانات الدخول غير صحيحة أو الحساب غير مفعّل.';msg.className='error';return;}
 document.getElementById('login').style.display='none';
 document.getElementById('app').style.display='block';
 await loadStudents();
}
async function logout(){await sb.auth.signOut();location.reload()}
async function loadStudents(){
 const {data,error}=await sb.from('students').select('*').order('created_at',{ascending:false}).limit(2000);
 if(error){alert('تعذر تحميل البيانات: '+error.message);return;}
 rows=data||[];render();
}
function render(){
 const s=document.getElementById('search').value.trim().toLowerCase();
 const l=document.getElementById('level').value,c=document.getElementById('className').value;
 const data=rows.filter(x=>(!s||(x.full_name||'').toLowerCase().includes(s))&&(!l||x.current_level===l)&&(!c||x.class_name===c));
 document.getElementById('count').textContent=rows.length;
 const today=new Date().toISOString().slice(0,10);
 document.getElementById('today').textContent=rows.filter(x=>String(x.created_at).slice(0,10)===today).length;
 document.getElementById('classes').textContent=new Set(rows.map(x=>x.class_name).filter(Boolean)).size;
 document.getElementById('level').innerHTML='<option value="">كل المستويات</option>'+levels.map(x=>'<option>'+esc(x)+'</option>').join('');
 const classes=[...new Set(rows.map(x=>x.class_name).filter(Boolean))].sort();
 document.getElementById('className').innerHTML='<option value="">كل الأقسام</option>'+classes.map(x=>'<option>'+esc(x)+'</option>').join('');
 document.getElementById('tableWrap').innerHTML='<table><thead><tr><th>الاسم</th><th>المستوى</th><th>القسم</th><th>الرياضة</th><th>الطول</th><th>الوزن</th><th>تاريخ التسجيل</th></tr></thead><tbody>'+
 data.map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+esc(x.current_level)+'</td><td>'+esc(x.class_name)+'</td><td>'+esc(x.favorite_sport||'')+'</td><td>'+esc(x.height||'')+'</td><td>'+esc(x.weight||'')+'</td><td>'+new Date(x.created_at).toLocaleString('ar-MA')+'</td></tr>').join('')+
 '</tbody></table>';
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function exportCSV(){
 if(!rows.length){alert('لا توجد بيانات.');return;}
 const keys=['full_name','full_name_fr','current_level','class_name','favorite_sport','represented','competition_name','competition_level','height','weight','created_at'];
 const csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='aqba_students_2026_2027.csv';a.click();
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('level').addEventListener('change',render);
document.getElementById('className').addEventListener('change',render);
</script>
</body>
</html>
