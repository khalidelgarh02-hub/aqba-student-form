<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فضاء الأستاذ — الجمعية الرياضية لعقبة بن نافع</title>
<style>
body{margin:0;background:#f4f7f8;color:#17202a;font-family:"Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif}
.container{max-width:1250px;margin:28px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e1e7eb;border-radius:16px;padding:20px;box-shadow:0 8px 24px #0000000a;margin-bottom:16px}
h1,h2{color:#0b6846}.center{text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select{width:100%;padding:11px;border:1px solid #ccd5db;border-radius:10px;box-sizing:border-box;font:inherit}
button{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font:inherit}.primary{background:#0b6846;color:white}.light{background:#eef2f4}.danger{background:#b42318;color:white}
.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f7faf8;border:1px solid #dce8e1;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:24px;color:#0b6846}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e8eb;text-align:right;white-space:nowrap}th{background:#f2f5f6}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}.modal-card{background:#fff;border-radius:16px;width:min(800px,100%);max-height:90vh;overflow:auto;padding:20px}.details{display:grid;grid-template-columns:1fr 1fr;gap:6px}.details div{border-bottom:1px solid #ddd;padding:7px}.details b{display:block;color:#59666f}
.error{color:#b42318;font-weight:700;text-align:center;margin-top:10px}
@media(max-width:700px){.grid,.details{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="container">
<div id="loginCard" class="card" style="max-width:470px;margin:70px auto">
  <h1 class="center">👨‍🏫 فضاء الأستاذ</h1>
  <p class="center">الثانوية التأهيلية عقبة بن نافع — الجمعية الرياضية</p>
  <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div>
  <div class="field" style="margin-top:10px"><label>كلمة المرور</label><input id="password" type="password"></div>
  <button class="primary" style="width:100%;margin-top:14px" onclick="login()">دخول</button>
  <div id="loginError" class="error"></div>
</div>

<div id="dashboard" style="display:none">
  <div class="card">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
      <div><h1 style="margin:0">👨‍🏫 لوحة الأستاذ</h1><div>متابعة وإدارة تسجيلات التلاميذ</div></div>
      <div class="actions"><button class="light" onclick="downloadCSV()">📥 Excel / CSV</button><button class="danger" onclick="logout()">🚪 خروج</button></div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="total">0</b>إجمالي التلاميذ</div>
    <div class="stat"><b id="male">0</b>ذكور</div>
    <div class="stat"><b id="female">0</b>إناث</div>
    <div class="stat"><b id="sports">0</b>رياضات مختلفة</div>
  </div>
  <div class="card">
    <div class="grid">
      <div><label>بحث بالاسم أو رقم التلميذ</label><input id="search" oninput="render()"></div>
      <div><label>القسم</label><select id="classFilter" onchange="render()"><option value="">جميع الأقسام</option></select></div>
    </div>
  </div>
  <div class="card table-wrap">
    <table><thead><tr><th>رقم التلميذ</th><th>الاسم</th><th>القسم</th><th>المستوى</th><th>الرياضة</th><th>التاريخ</th><th></th></tr></thead>
    <tbody id="tbody"></tbody></table>
  </div>
</div>
</div>

<div id="modal" class="modal">
 <div class="modal-card">
  <h2 id="modalTitle"></h2>
  <div id="details" class="details"></div>
  <div class="actions" style="margin-top:14px"><button class="light" onclick="closeModal()">إغلاق</button></div>
 </div>
</div>

<script>
const URL='https://jwzebyfhsfszpgswnbyh.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJqd3plYnlmaHNm c3pwZ3N3bmJ5aCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg3OTk4Njk4LCJleHAiOjIxMDM1NzQ2OTh9.fh5DvtvMMZn3rPkFnJsVokJJPfJQLZYWGrQsEGrMQbc'.replace(' ','');
let token='', rows=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
async function login(){
 const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
 const er=document.getElementById('loginError'); er.textContent='';
 try{
  const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const s=await r.json(); if(!r.ok||!s.access_token)throw Error('بيانات الدخول غير صحيحة.');
  token=s.access_token; sessionStorage.setItem('aqba_teacher_token',token);
  await load();
 }catch(e){er.textContent=e.message||'تعذر تسجيل الدخول.'}
}
async function load(){
 const r=await fetch(URL+'/rest/v1/students?select=*&order=created_at.desc',{headers:{apikey:KEY,Authorization:'Bearer '+token}});
 const data=await r.json(); if(!r.ok)throw Error('ليس لديك صلاحية الوصول إلى بيانات التلاميذ.');
 rows=data; document.getElementById('loginCard').style.display='none'; document.getElementById('dashboard').style.display='block'; render();
}
function render(){
 const q=document.getElementById('search').value.toLowerCase(), c=document.getElementById('classFilter').value;
 const filtered=rows.filter(x=>(!q||String(x.full_name||'').toLowerCase().includes(q)||String(x.student_number||'').toLowerCase().includes(q))&&(!c||x.class_name===c));
 document.getElementById('tbody').innerHTML=filtered.map((x,i)=>`<tr><td>${esc(x.student_number)}</td><td>${esc(x.full_name)}</td><td>${esc(x.class_name)}</td><td>${esc(x.current_level)}</td><td>${esc(x.favorite_sport==='رياضة أخرى'?x.other_sport:x.favorite_sport)}</td><td>${esc((x.created_at||'').slice(0,10))}</td><td><button class="light" onclick="view(${rows.indexOf(x)})">عرض</button></td></tr>`).join('')||'<tr><td colspan="7">لا توجد نتائج.</td></tr>';
 document.getElementById('total').textContent=rows.length;
 document.getElementById('male').textContent=rows.filter(x=>x.gender==='ذكر').length;
 document.getElementById('female').textContent=rows.filter(x=>x.gender==='أنثى').length;
 document.getElementById('sports').textContent=new Set(rows.map(x=>x.favorite_sport||x.other_sport).filter(Boolean)).size;
 const sel=document.getElementById('classFilter'), old=c;
 sel.innerHTML='<option value="">جميع الأقسام</option>'+[...new Set(rows.map(x=>x.class_name).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('');
 sel.value=old;
}
function view(i){
 const x=rows[i]; document.getElementById('modalTitle').textContent=`${x.full_name||''} — ${x.student_number||''}`;
 const fields=[
 ['الاسم الكامل',x.full_name],['Nom et Prénom',x.full_name_fr],['تاريخ الازدياد',x.birth_date],['مكان الازدياد',x.birth_place],
 ['العنوان',x.address],['القسم',x.class_name],['المستوى',x.current_level],['المستوى السابق',x.old_level],
 ['المسافة',x.distance],['مدة الوصول',x.travel_time],['وسيلة التنقل',x.transport],['مهنة الأب',x.father_job],['مهنة الأم',x.mother_job],
 ['عدد الإخوة',x.siblings],['الذكور',x.brothers],['الإناث',x.sisters],['الطول',x.height],['الوزن',x.weight],
 ['الرياضة',x.favorite_sport==='رياضة أخرى'?x.other_sport:x.favorite_sport],['تمثيل المؤسسة',x.represented?'نعم':x.represented===false?'لا':'—'],
 ['المسابقة',x.competition_name],['المستوى',x.competition_level],['السنة',x.competition_year],['الرياضة في المسابقة',x.competition_sport],
 ['الحالة الصحية',x.health_status],['تفاصيل صحية',x.illness_details],['المشكل الشخصي',x.personal_problem]
 ];
 document.getElementById('details').innerHTML=fields.map(([a,b])=>`<div><b>${esc(a)}</b>${esc(b||'—')}</div>`).join('');
 document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none'}
function downloadCSV(){
 const cols=['student_number','full_name','full_name_fr','birth_date','birth_place','address','class_name','current_level','old_level','distance','travel_time','transport','father_job','mother_job','siblings','brothers','sisters','favorite_sport','represented','competition_name','competition_level','competition_year','competition_sport','height','weight','health_status','illness_details','personal_problem','created_at'];
 const csv=[cols.join(','),...rows.map(x=>cols.map(k=>`"${String(x[k]??'').replace(/"/g,'""')}"`).join(','))].join('\\n');
 const blob=new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}), a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AQBA_Liste_Eleves_2026-2027.csv';a.click();
}
function logout(){sessionStorage.removeItem('aqba_teacher_token');location.reload()}
(async()=>{const t=sessionStorage.getItem('aqba_teacher_token');if(t){token=t;try{await load()}catch(e){sessionStorage.removeItem('aqba_teacher_token')}}})();
</script>
</body></html>
