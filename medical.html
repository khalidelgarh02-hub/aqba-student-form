<style>

 4">الأولى باكالوريا آداب وعلوم إنسانية 4</option><option value="الأولى باكالوريا آداب وعلوم إنسانية 5">الأولى باكالوريا آداب وعلوم إنسانية 5</option><option value="الأولى باكالوريا آداب وعلوم إنسانية 6">الأولى باكالوريا آداب وعلوم إنسانية 6</option><option value="الأولى باكالوريا آداب وعلوم إنسانية 7">الأولى باكالوريا آداب وعلوم إنسانية 7</option><option value="الثانية باكالوريا علوم فيزيائية 1">الثانية باكالوريا علوم فيزيائية 1</option><option value="الثانية باكالوريا علوم فيزيائية 2">الثانية باكالوريا علوم فيزيائية 2</option><option value="الثانية باكالوريا علوم فيزيائية 3">الثانية باكالوريا علوم فيزيائية 3</option><option value="الثانية باكالوريا علوم الحياة والأرض 1">الثانية باكالوريا علوم الحياة والأرض 1</option><option value="الثانية باكالوريا علوم الحياة والأرض 2">الثانية باكالوريا علوم الحياة والأرض 2</option><option value="الثانية باكالوريا علوم الحياة والأرض 3">الثانية باكالوريا علوم الحياة والأرض 3</option><option value="الثانية باكالوريا علوم إنسانية 1">الثانية باكالوريا علوم إنسانية 1</option><option value="الثانية باكالوريا علوم إنسانية 2">الثانية باكالوريا علوم إنسانية 2</option><option value="الثانية باكالوريا علوم إنسانية 3">الثانية باكالوريا علوم إنسانية 3</option><option value="الثانية باكالوريا علوم إنسانية 4">الثانية باكالوريا علوم إنسانية 4</option><option value="الثانية باكالوريا علوم إنسانية 5">الثانية باكالوريا علوم إنسانية 5</option><option value="الثانية باكالوريا آداب 1">الثانية باكالوريا آداب 1</option><option value="الثانية باكالوريا آداب 2">الثانية باكالوريا آداب 2</option></select></div>
</div>
<h2 class="section">القياسات الأنثروبومترية</h2>
<div class="grid">
<div><label>الطول</label><input id="height" inputmode="decimal" placeholder="cm"></div><div><label>الوزن</label><input id="weight" inputmode="decimal" placeholder="kg"></div><div class="full"><label>معدل ضربات القلب</label><input id="heart_rate" inputmode="numeric" placeholder="نبضة/الدقيقة"></div>
</div>
<h2 class="section">الاختبارات البدنية</h2>
<div class="grid">
<div><label>VMA</label><input id="vma" placeholder="km/h"></div><div><label>العدو السريع 30 متر</label><input id="sprint30" placeholder="ثانية"></div><div><label>القفز الأفقي</label><input id="horizontal_jump" placeholder="cm"></div><div><label>القفز العمودي</label><input id="vertical_jump" placeholder="cm"></div><div><label>رمي الكرة الطبية</label><input id="medicine_ball" placeholder="m"></div><div><label>المرونة جلوساً</label><input id="sit_flexibility" placeholder="cm"></div><div><label>المرونة وقوفاً</label><input id="stand_flexibility" placeholder="cm"></div><div><label>التوازن الثابت</label><input id="static_balance" placeholder="ثانية"></div>
</div>
<div class="actions no-print"><button class="primary" type="submit">حفظ المعلومات</button><button class="light" type="button" onclick="window.print()">طباعة</button><button class="light" type="button" onclick="location.href='index.html'">العودة إلى بوابة التلميذ</button></div>

</form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://jwzebyfhsfszpgswnbyh.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3emVieWJoc2ZzenBnc3duYnloIiwiaWF0IjoxNzg3OTk4Njk4LCJleHAiOjIxMDM1NzQ2OTh9.fh5DvtvMMZn3rPkFnJsVokJJPfJQLZYWGrQsEGrMQbc';

$('form').addEventListener('submit',async e=>{e.preventDefault();$('msg').className='msg';$('msg').textContent='جارٍ الحفظ...';
const row={student_number:$('student_number').value.trim(),full_name:$('full_name').value.trim(),class_name:$('class_name').value.trim(),height:$('height').value||null,weight:$('weight').value||null,heart_rate:$('heart_rate').value||null,vma:$('vma').value||null,sprint30:$('sprint30').value||null,horizontal_jump:$('horizontal_jump').value||null,vertical_jump:$('vertical_jump').value||null,medicine_ball:$('medicine_ball').value||null,sit_flexibility:$('sit_flexibility').value||null,stand_flexibility:$('stand_flexibility').value||null,static_balance:$('static_balance').value||null};
