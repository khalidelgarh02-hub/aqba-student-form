<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الملفات الطبية — بوابة الأستاذ</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#17212b;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dfe6eb;border-radius:16px;box-shadow:0 5px 20px #0000000b;padding:18px;margin-bottom:16px}.brand{border-top:5px solid #0b7a4b;text-align:center}.brand h1{color:#c92323}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:240px}input{padding:11px;border:1px solid #cbd3da;border-radius:9px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:#0b7a4b;color:#fff}.blue{background:#1976b9;color:#fff}.light{background:#e9eef2}.error{color:#b52a2a;font-weight:700}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #e7ebee;text-align:right}th{background:#f5f8fa}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.section h3{background:#eef7f2;color:#126b46;border-right:4px solid #0b7a4b;padding:9px}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:15px}.box{background:#fff;max-width:900px;width:100%;max-height:94vh;overflow:auto;border-radius:16px;padding:18px}.box input,.box textarea{width:100%;padding:10px}.box textarea{min-height:80px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card brand"><h1>إدارة الملفات الطبية والبدنية</h1><div>الثانوية التأهيلية عقبة بن نافع — 2026-2027</div></div><div id="login" class="card"><label>البريد الإلكتروني</label><input id="email" type="email"><label>كلمة المرور</label><input id="password" type="password"><button class="btn primary" id="loginBtn" style="margin-top:12px">دخول</button><div id="loginMsg"></div></div><section id="app" class="hidden"><div class="card"><div class="toolbar"><input id="q" placeholder="الاسم، رقم التلميذ، القسم..."><button class="btn blue" id="search">بحث</button><button class="btn light" id="logout">خروج</button></div></div><div class="card"><div id="msg"></div><div class="tablewrap"><table><thead><tr><th>رقم التلميذ</th><th>الاسم</th><th>القسم</th><th>المستوى</th><th>الملف الطبي</th></tr></thead><tbody id="tbody"></tbody></table></div></div></section></main><div id="modal" class="modal hidden"><div class="box"><h2 id="title"></h2><div class="grid"><div><label>معدل ضربات القلب</label><input id="heart_rate"></div><div><label>VMA</label><input id="vma"></div><div><label>العدو 30 متر</label><input id="run_30m"></div><div><label>القفز الأفقي</label><input id="horizontal_jump"></div><div><label>القفز العمودي</label><input id="vertical_jump"></div><div><label>رمي الكرة الطبية</label><input id="medicine_ball_throw"></div><div><label>المرونة جلوساً</label><input id="flexibility_sitting"></div><div><label>المرونة وقوفاً</label><input id="flexibility_standing"></div><div><label>التوازن الثابت</label><input id="static_balance"></div><div><label>تاريخ القياس</label><input id="measured_at" type="date"></div></div><label style="margin-top:12px">ملاحظات</label><textarea id="notes"></textarea><div style="margin-top:14px"><button class="btn primary" id="save">حفظ</button><button class="btn light" id="close">إغلاق</button></div><div id="saveMsg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://jwzebyfhsfszpgswnbyh.supabase.co';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3emVieWZoc2ZzenBnc3duYnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5OTg2OTgsImV4cCI6MjEwMzU3NDY5OH0.fh5DvtvMMZn3rPkFnJsVokJJPfJQLZYWGrQsEGrMQbc';const sb=supabase.createClient(URL,KEY);const $=x=>document.getElementById(x);let rows=[],current;async function login(){const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').className='error';$('loginMsg').textContent=error.message;return}show()}async function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}async function load(){const {data,error}=await sb.auth.getSession();if(error||!data.session){return}const r=await fetch(URL+'/functions/v1/teacher-medical?q='+encodeURIComponent($('q').value),{headers:{Authorization:'Bearer '+data.session.access_token}});const j=await r.json();if(!r.ok){$('msg').className='error';$('msg').textContent=j.error||'تعذر تحميل البيانات';return}rows=j.rows||[];$('tbody').innerHTML=rows.map((x,i)=>'<tr><td>'+esc(x.student_number)+'</td><td>'+esc(x.full_name)+'</td><td>'+esc(x.class_name||'')+'</td><td>'+esc(x.current_level||'')+'</td><td><button class="btn blue" onclick="openRow('+i+')">فتح الملف</button></td></tr>').join('')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}window.openRow=i=>{current=rows[i];const m=current.student_medical_records?.[0]||{};$('title').textContent=current.full_name+' — '+current.student_number;['heart_rate','vma','run_30m','horizontal_jump','vertical_jump','medicine_ball_throw','flexibility_sitting','flexibility_standing','static_balance','measured_at','notes'].forEach(k=>$(`${k}`).value=m[k]??'');$('modal').classList.remove('hidden')};$('loginBtn').onclick=login;$('search').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('close').onclick=()=>$('modal').classList.add('hidden');$('save').onclick=async()=>{const {data:{session}}=await sb.auth.getSession();const b={student_id:current.id};['heart_rate','vma','run_30m','horizontal_jump','vertical_jump','medicine_ball_throw','flexibility_sitting','flexibility_standing','static_balance','measured_at','notes'].forEach(k=>b[k]=$(k).value);const r=await fetch(URL+'/functions/v1/teacher-medical',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();$('saveMsg').className=r.ok?'':'error';$('saveMsg').textContent=r.ok?'تم الحفظ بنجاح.':(j.error||'تعذر الحفظ.');if(r.ok)load()};</script></body></html>
